name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      csharp: ${{ steps.detect.outputs.csharp }}
      kotlin: ${{ steps.detect.outputs.kotlin }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Projects live in <year>/<language>. Each language gets a JSON matrix of
      # the projects that need testing: changed project, changed shared/<language>
      # code, or a changed workflow. Manual runs test everything.
      - name: Detect changed projects
        id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          LANGUAGES: csharp kotlin go
        run: |
          changed_files=""
          run_all=false
          case "$EVENT" in
            pull_request) changed_files=$(git diff --name-only "origin/$BASE_REF...HEAD") || run_all=true ;;
            push)         changed_files=$(git diff --name-only "$BEFORE" HEAD) || run_all=true ;;
            *)            run_all=true ;;
          esac

          if grep -q '^\.github/workflows/' <<< "$changed_files"; then
            run_all=true
          fi

          for dir in [0-9][0-9][0-9][0-9]/*/; do
            lang=$(basename "$dir")
            [[ " $LANGUAGES " == *" $lang "* ]] || echo "::warning::No CI support for ${dir%/}"
          done

          for lang in $LANGUAGES; do
            matrix=$(
              for dir in [0-9][0-9][0-9][0-9]/"$lang"; do
                [[ -d "$dir" ]] || continue
                if [[ "$run_all" == true ]] \
                  || grep -q "^$dir/" <<< "$changed_files" \
                  || grep -q "^shared/$lang/" <<< "$changed_files"; then
                  echo "$dir"
                fi
              done | jq -Rnc '[inputs | {path: .}]'
            )
            echo "$lang=$matrix" | tee -a "$GITHUB_OUTPUT"
          done

  csharp:
    needs: changes
    if: ${{ needs.changes.outputs.csharp != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.csharp) }}
    uses: ./.github/workflows/test-dotnet.yml
    with:
      path: ${{ matrix.path }}

  kotlin:
    needs: changes
    if: ${{ needs.changes.outputs.kotlin != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.kotlin) }}
    uses: ./.github/workflows/test-gradle.yml
    with:
      path: ${{ matrix.path }}

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.go) }}
    uses: ./.github/workflows/test-go.yml
    with:
      path: ${{ matrix.path }}

  # Single stable check to require in branch protection: matrix job names change
  # with the projects touched, and skipped language jobs must not block merging.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, csharp, kotlin, go]
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
