<meta name="color-scheme" content="light dark">
<style>
  @media (prefers-color-scheme: dark) {
    body, .markdown-body { background-color: #0d1117; color: #e6edf3; }
    .markdown-body a { color: #4493f8; }
    .markdown-body h1, .markdown-body h2, .markdown-body hr { border-color: #30363d; }
    .markdown-body hr { background-color: #30363d; }
    .markdown-body h6, .markdown-body blockquote { color: #9198a1; border-color: #30363d; }
    .markdown-body table tr { background-color: #0d1117; border-color: #30363d; }
    .markdown-body table tr:nth-child(2n) { background-color: #151b23; }
    .markdown-body table th, .markdown-body table td { border-color: #30363d; }
    .markdown-body pre, .markdown-body .highlight pre { background-color: #151b23; color: #e6edf3; }
    .markdown-body code { background-color: #6e768166; }
    .markdown-body pre code { background-color: transparent; }
    .highlight, .highlight .w { color: #e6edf3; background-color: #151b23; }
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .cs, .highlight .cp { color: #9198a1; }
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kr, .highlight .o, .highlight .ow { color: #ff7b72; }
    .highlight .kt, .highlight .nc, .highlight .nn, .highlight .nb { color: #ffa657; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .sx { color: #a5d6ff; }
    .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh, .highlight .kc, .highlight .na, .highlight .nv { color: #79c0ff; }
    .highlight .nf, .highlight .nx { color: #d2a8ff; }
    .highlight .err { color: #ffa198; background-color: transparent; }
  }
</style>
